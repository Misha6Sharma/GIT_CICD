name: CI/CD Pipeline

# When this workflow runs
on:
  push:
    branches: [ main ]         # Runs when you push to main branch
  pull_request:
    branches: [ main ]         # Runs when a PR targets main

jobs:

  lint:
    name: 🧹 Lint Code
    runs-on: ubuntu-latest     # VM used to run workflow
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # Pulls your code into workflow

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint
        run: pylint app || true   # Checks code quality; '|| true' prevents failure if lint issues

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint                    # Runs only after lint job
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v            # Runs all tests in 'tests/' folder

  docker:
    name:  Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                   # Runs only after tests pass
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .               # Build context (root of repo)
          file: ./Dockerfile       # Dockerfile location
          push: true               # Push image to Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:latest
